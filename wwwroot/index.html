<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="https://bigdatatech.vn/favicon.ico">
    <link
      rel="stylesheet"
      href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.css"
    >
    <link rel="stylesheet" href="/output.css">
    <title>DWG Viewer</title>
  </head>
  <body>
    <div id="header" class="px-4 gap-2">
      <a class="grow font-bold" href="/">DWG Viewer</a>
      <select name="models" id="models"></select>
      <button id="upload" title="Upload New Model">Upload</button>
      <input style="display: none" type="file" id="input">
    </div>
    <div id="preview"></div>
    <div id="overlay"></div>
    <dialog id="temSddModal" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
            <iconify-icon
              class="text-neutral-500"
              icon="mdi:close"
              width="20"
              noobserver
            ></iconify-icon>
          </button>
        </form>
        <h3 class="text-xl font-bold">Info</h3>
        <div id="infoContent" class="space-y-2">
          <p>
            <strong>Tên:</strong>
            <span class="name"></span>
          </p>
          <p>
            <strong>Diện tích:</strong>
            <span class="area"></span>
          </p>
          <p>
            <strong>MĐXD:</strong>
            <span class="mdxd"></span>
          </p>
          <p>
            <strong>Tầng cao Min/Max:</strong>
            <span class="minmax"></span>
          </p>
          <p>
            <strong>Hệ số SDĐ:</strong>
            <span class="hs"></span>
          </p>
          <label class="label"></label>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button class="cursor-default">Close</button>
      </form>
    </dialog>
    <dialog id="sdd2Modal" class="modal">
      <div class="modal-box">
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">
            <iconify-icon
              class="text-neutral-500"
              icon="mdi:close"
              width="20"
              noobserver
            ></iconify-icon>
          </button>
        </form>
        <h3 class="text-xl font-bold">Info</h3>
        <div id="infoContent" class="space-y-2">
          <p>
            <strong>Tên:</strong>
            <span class="name"></span>
          </p>
          <p>
            <strong>Diện tích:</strong>
            <span class="area"></span>
          </p>
          <label class="label"></label>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button class="cursor-default">Close</button>
      </form>
    </dialog>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script src="https://unpkg.com/jsts@2.12.1/dist/jsts.min.js"></script>.
    <script
      src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.js"
    ></script>
    <script src="./main.js" type="module"></script>
  </body>
</html>
